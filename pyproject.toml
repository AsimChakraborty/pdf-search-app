[project]
name = "scan_test"
version = "1.0.0"
description = "PDF Search Engine with FTS5"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "pdfplumber>=0.10.3",
    "werkzeug>=3.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]